[workspace]
resolver = "2"
members = [
    "market",
    "pricing",
    "resolution",
    "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/lumecast/contracts"
authors = ["Lumecast"]

# The Soroban SDK version is pinned exactly here so every crate in the
# workspace and every CI run builds against the same semantics.
[workspace.dependencies]
soroban-sdk = "=28.0.0"

[profile.release]
opt-level = "z"
overflow-checks = true
lto = true